{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Удаление продукта</h2>

    <p>Вы действительно хотите удалить продукт «{{ object.name }}»?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'product_detail' object.pk %}" class="btn btn-secondary">
            Отмена
        </a>
    </form>
</div>
{% endblock %}
